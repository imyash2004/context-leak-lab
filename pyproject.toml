[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cll"
version = "0.1.0"
description = "Context Leak Lab: do AI agents leak what is in their context?"
requires-python = ">=3.11"
dependencies = ["anthropic", "pyyaml", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
